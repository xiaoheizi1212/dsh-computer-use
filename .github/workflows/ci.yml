name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      # Keyless contract tests: fake lifecycle/invariants, risk, parseAction,
      # perceiveAccessibility, native framing, native transport, and the windows
      # provider (mock helper). Playwright tests self-skip without Chromium.
      - run: pnpm test
